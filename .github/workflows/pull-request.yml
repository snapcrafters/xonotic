name: Pull Request

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build snap
    runs-on: ubuntu-latest

    steps:
      - name: Build and review snap on amd64
        uses: snapcrafters/ci/test-snap-build@main

      - name: Show Snapcraft log on build failure
        if: failure()
        run: cat /home/runner/.local/state/snapcraft/log/snapcraft*.log

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: xonotic-snap
          path: "*.snap"
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    name: Launch snap and capture screenshots
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: xonotic-snap

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up LXD
        uses: canonical/setup-lxd@v0.1.1

      - name: Install ghvmctl
        run: |
          sudo snap install ghvmctl
          sudo snap connect ghvmctl:lxd lxd:lxd

      - name: Prepare VM
        run: ghvmctl prepare

      - name: Install local snap in VM
        run: |
          set -eux
          SNAP_FILE=$(find . -maxdepth 1 -name '*.snap' | head -n 1)
          VM_NAME=$(ghvmctl exec -- hostname | tr -d '\n')
          lxc file push "$SNAP_FILE" "local:${VM_NAME}/home/ubuntu/$(basename "$SNAP_FILE")"
          ghvmctl exec -- sudo snap install --dangerous "/home/ubuntu/$(basename "$SNAP_FILE")"

      - name: Connect user data interface
        run: ghvmctl exec -- sudo snap connect xonotic:dot-xonotic

      - name: Check shared user data access
        run: |
          for app in xonotic xonotic.dedicated; do
            ghvmctl exec -- snap run --shell "$app" -c 'set -eu; mkdir -p "$SNAP_REAL_HOME/.xonotic/data"; printf "%s\n" shared-data > "$SNAP_REAL_HOME/.xonotic/data/snap-smoke-test"; test "$(cat "$SNAP_REAL_HOME/.xonotic/data/snap-smoke-test")" = shared-data; rm "$SNAP_REAL_HOME/.xonotic/data/snap-smoke-test"'
          done

      - name: Launch Xonotic
        run: |
          ghvmctl snap-run xonotic.xonotic
          sleep 45

      - name: Capture screenshots
        if: always()
        run: |
          ghvmctl screenshot-full
          ghvmctl screenshot-window
          ls -lh "$HOME/ghvmctl-screenshots/" || true

      - name: Show app logs
        if: always()
        run: ghvmctl exec -- cat /home/ubuntu/xonotic.xonotic.log 2>/dev/null || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xonotic-screenshots
          path: ~/ghvmctl-screenshots/
          if-no-files-found: warn
          retention-days: 14
