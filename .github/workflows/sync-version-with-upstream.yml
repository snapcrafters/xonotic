name: Sync version with upstream
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    name: 🔄 Sync version with upstream
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Sync version with upstream
        uses: snapcrafters/ci/sync-version@main
        with:
          token: ${{ secrets.SNAPCRAFTERS_BOT_COMMIT }}
          update-script: |
            set -euo pipefail
            : "${UPSTREAM_RELEASES_URL:=https://xonotic.org/download/}"
            : "${MANIFEST:=snap/snapcraft.yaml}"
            VERSION_PATTERN='^[0-9]+([.][0-9A-Za-z]+)*([-+~][0-9A-Za-z.-]+)?$'
            BEFORE=$(mktemp)
            CANDIDATE=$(mktemp "${MANIFEST}.sync-version.XXXXXX")
            RESTORE=0
            cleanup() {
              status=$?
              trap - EXIT
              if (( status != 0 && RESTORE == 1 )); then
                cp -- "$BEFORE" "$MANIFEST"
              fi
              rm -f -- "$BEFORE" "$CANDIDATE"
              exit "$status"
            }
            trap cleanup EXIT
            cp -- "$MANIFEST" "$BEFORE"
            RAW_VERSION=$(curl -fsSL --max-time 60 "$UPSTREAM_RELEASES_URL" | python3 -c '
            import re, sys
            page = sys.stdin.read()
            versions = re.findall(r"<h2>Download Xonotic ([0-9]+(?:[.][0-9]+)+)</h2>", page)
            if len(versions) != 1:
                sys.exit("expected exactly one stable download heading")
            print(versions[0])
            ')
            VERSION=${RAW_VERSION#v}
            [[ ${#VERSION} -ge 1 && ${#VERSION} -le 128 && "$VERSION" =~ $VERSION_PATTERN ]] || {
              printf 'unsafe or empty upstream version: %q\n' "$VERSION" >&2
              exit 1
            }
            VERSION_COUNT=$(grep -cE '^version:[[:space:]]*' "$MANIFEST" || true)
            [[ "$VERSION_COUNT" -eq 1 ]] || { echo 'expected exactly one version field' >&2; exit 1; }
            OLD_LINE=$(grep -E '^version:[[:space:]]*' "$MANIFEST")
            if [[ "$OLD_LINE" =~ ^version:[[:space:]]*\"([^\"]+)\"[[:space:]]*$ ]]; then
              OLD_VERSION=${BASH_REMATCH[1]}
            elif [[ "$OLD_LINE" =~ ^version:[[:space:]]*\'([^\']+)\'[[:space:]]*$ ]]; then
              OLD_VERSION=${BASH_REMATCH[1]}
            elif [[ "$OLD_LINE" =~ ^version:[[:space:]]*([^[:space:]#]+)[[:space:]]*$ ]]; then
              OLD_VERSION=${BASH_REMATCH[1]}
            else
              echo 'existing version is absent or unsafe' >&2
              exit 1
            fi
            [[ ${#OLD_VERSION} -ge 1 && ${#OLD_VERSION} -le 128 && "$OLD_VERSION" =~ $VERSION_PATTERN ]] || {
              echo 'existing version is absent or unsafe' >&2
              exit 1
            }
            if [[ "$VERSION" == "$OLD_VERSION" ]]; then
              echo "upstream version is unchanged: $VERSION"
              exit 0
            fi
            sed -E 's|^version:[[:space:]]*.*$|version: "'"$VERSION"'"|' "$MANIFEST" > "$CANDIDATE"
            chmod --reference="$MANIFEST" "$CANDIDATE"
            ! cmp -s "$BEFORE" "$CANDIDATE" || { echo 'manifest did not change' >&2; exit 1; }
            [[ $(grep -cE '^version:[[:space:]]*' "$CANDIDATE") -eq 1 ]] || { echo 'version field count changed' >&2; exit 1; }
            grep -Fxq "version: \"${VERSION}\"" "$CANDIDATE" || { echo 'new version not exact' >&2; exit 1; }
            ! grep -Fxq "version: \"${OLD_VERSION}\"" "$CANDIDATE" || { echo 'old version remains' >&2; exit 1; }
            RESTORE=1
            mv -- "$CANDIDATE" "$MANIFEST"
            grep -Fxq "version: \"${VERSION}\"" "$MANIFEST" || { echo 'postcondition failed' >&2; exit 1; }
            [[ $(grep -cE '^version:[[:space:]]*' "$MANIFEST") -eq 1 ]] || { echo 'postcondition failed' >&2; exit 1; }
            RESTORE=0
